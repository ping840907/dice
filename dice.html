<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D 重力骰子</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0d1117; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        #ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: rgba(0, 0, 0, 0.85);
            z-index: 20;
            color: white;
            text-align: center;
            transition: opacity 0.5s;
        }
        #start-btn {
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            color: #fff;
            background-color: #e74c3c;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: transform 0.1s, background-color 0.2s;
        }
        #start-btn:active {
            transform: scale(0.95);
            background-color: #c0392b;
        }
        #instruction-text {
            font-size: 16px;
            margin-top: 20px;
            color: #bdc3c7;
            line-height: 1.6;
            max-width: 80%;
        }
        #controls {
            position: absolute;
            bottom: 30px;
            right: 30px;
            display: none;
            gap: 15px;
            z-index: 10;
        }
        .control-btn {
            width: 50px;
            height: 50px;
            font-size: 28px;
            font-weight: bold;
            color: #fff;
            background-color: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
            transition: background-color 0.2s, transform 0.1s;
        }
        .control-btn:active {
            background-color: rgba(255, 255, 255, 0.4);
            transform: scale(0.9);
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/geometries/RoundedBoxGeometry.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
</head>
<body>

    <div id="ui-layer">
        <h2>3D 重力骰子</h2>
        <button id="start-btn">點擊開始</button>
        <div id="instruction-text">
            向上甩動手機可拋擲骰子<br>
            全方位空間感測，無死角滾動
        </div>
    </div>

    <div id="controls">
        <button class="control-btn" id="remove-dice-btn">-</button>
        <button class="control-btn" id="add-dice-btn">+</button>
    </div>

    <div id="canvas-container"></div>

    <script>
        window.onerror = function(message, source, lineno, colno, error) {
            alert("程式出錯：\n" + message + "\n行號：" + lineno);
            return true;
        };

        let scene, camera, renderer, world;
        let standardMaterial;
        
        let diceMeshes = [];
        let diceBodies = [];
        
        let lastTime;
        let isGameStarted = false;

        const cameraY = 22;      
        const boxDepth = 8;      

        let lastShakeTime = 0;
        const SHAKE_THRESHOLD = 15; 

        // 預先宣告四元數運算物件，提升效能
        const _zee = new THREE.Vector3(0, 0, 1);
        const _euler = new THREE.Euler();
        const _q0 = new THREE.Quaternion();
        const _q1 = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5));
        const _worldGravity = new THREE.Vector3(0, -1, 0);

        function init() {
            const container = document.getElementById('canvas-container');
            const aspect = window.innerWidth / window.innerHeight;

            scene = new THREE.Scene();
            scene.background = new THREE.Color('#0d1117');

            camera = new THREE.PerspectiveCamera(35, aspect, 0.1, 100);
            camera.position.set(0, cameraY, 0); 
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap; 
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.65);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.7);
            directionalLight.position.set(10, 20, 5);
            directionalLight.castShadow = true;
            directionalLight.shadow.camera.left = -25;
            directionalLight.shadow.camera.right = 25;
            directionalLight.shadow.camera.top = 25;
            directionalLight.shadow.camera.bottom = -25;
            directionalLight.shadow.mapSize.width = 1024;
            directionalLight.shadow.mapSize.height = 1024;
            scene.add(directionalLight);

            world = new CANNON.World();
            world.gravity.set(0, -11.8, 0);
            world.broadphase = new CANNON.NaiveBroadphase();
            world.solver.iterations = 10;

            standardMaterial = new CANNON.Material('standard');
            
            const universalContact = new CANNON.ContactMaterial(
                standardMaterial,
                standardMaterial,
                { friction: 0.003, restitution: 0.55 } 
            );
            world.addContactMaterial(universalContact);

            const planeGeometry = new THREE.PlaneGeometry(100, 100);
            const planeMaterial = new THREE.MeshStandardMaterial({ color: '#1e272e', roughness: 0.9 });
            const planeMesh = new THREE.Mesh(planeGeometry, planeMaterial);
            planeMesh.rotation.x = -Math.PI / 2;
            planeMesh.receiveShadow = true;
            scene.add(planeMesh);

            const groundBody = new CANNON.Body({ mass: 0, material: standardMaterial });
            groundBody.addShape(new CANNON.Plane());
            groundBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
            world.addBody(groundBody);

            const ceilingBody = new CANNON.Body({ mass: 0, material: standardMaterial });
            ceilingBody.addShape(new CANNON.Plane());
            ceilingBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), Math.PI / 2); 
            ceilingBody.position.set(0, boxDepth, 0);
            world.addBody(ceilingBody);

            updateWallas(standardMaterial);

            addDice();

            window.addEventListener('resize', onWindowResize);

            lastTime = performance.now();
            animate();
        }

        function addDice() {
            const diceSize = 1.0; 
            const cornerRadius = 0.15; 
            const cornerSegments = 5;  

            const geometry = new THREE.RoundedBoxGeometry(diceSize, diceSize, diceSize, cornerSegments, cornerRadius);
            const materials = [
                createDiceFace(1), createDiceFace(6),
                createDiceFace(2), createDiceFace(5),
                createDiceFace(3), createDiceFace(4)
            ];
            
            const mesh = new THREE.Mesh(geometry, materials);
            mesh.castShadow = true;
            scene.add(mesh);
            diceMeshes.push(mesh);

            const body = new CANNON.Body({ mass: 1, material: standardMaterial });
            body.addShape(new CANNON.Box(new CANNON.Vec3(diceSize / 2, diceSize / 2, diceSize / 2)));
            
            const offsetX = (Math.random() - 0.5) * 4;
            const offsetZ = (Math.random() - 0.5) * 4;
            body.position.set(offsetX, 1.5 + diceBodies.length, offsetZ); 
            
            body.updateMassProperties(); 
            const rollFactor = 0.5; 
            body.inertia.set(
                body.inertia.x * rollFactor,
                body.inertia.y * rollFactor,
                body.inertia.z * rollFactor
            );
            body.invInertia.set(
                1 / body.inertia.x,
                1 / body.inertia.y,
                1 / body.inertia.z
            );

            body.angularDamping = 0.05;  
            body.linearDamping = 0.005;  
            world.addBody(body);
            diceBodies.push(body);

            body.addEventListener('collide', function(e) {
                if (!navigator.vibrate) return;
                const impactVelocity = Math.abs(e.contact.getImpactVelocityAlongNormal());
                if (impactVelocity > 15.0) {
                    navigator.vibrate(40);
                } else if (impactVelocity > 2.0) {
                    navigator.vibrate(10);
                }
            });
        }

        function removeDice() {
            if (diceBodies.length <= 1) return; 
            
            const body = diceBodies.pop();
            const mesh = diceMeshes.pop();
            
            world.removeBody(body);
            scene.remove(mesh);
            
            mesh.geometry.dispose();
            mesh.material.forEach(m => {
                if(m.map) m.map.dispose();
                m.dispose();
            });
        }

        function tossDice(intensity, accX, accY, accZ) {
            const forceFactor = THREE.MathUtils.clamp(intensity * 1.5, 15, 50);
            const gravityDirection = world.gravity.y > 0 ? -1 : 1; 

            diceBodies.forEach(body => {
                body.wakeUp();
                body.velocity.y = forceFactor * gravityDirection;

                if (accX !== undefined && accY !== undefined) {
                    body.velocity.x = -accX * 1.5 + (Math.random() - 0.5) * 5; 
                    body.velocity.z = accY * 1.5 + (Math.random() - 0.5) * 5;  
                } else {
                    body.velocity.x = (Math.random() - 0.5) * 15;
                    body.velocity.z = (Math.random() - 0.5) * 15;
                }

                body.angularVelocity.set(
                    (Math.random() - 0.5) * 80,
                    (Math.random() - 0.5) * 80,
                    (Math.random() - 0.5) * 80
                );
            });
        }

        function handleMotion(event) {
            if(!isGameStarted) return;

            let acc = event.acceleration;
            if (!acc || acc.x === null) {
                acc = event.accelerationIncludingGravity;
            }
            if (!acc) return;

            const accMagnitude = Math.sqrt(acc.x * acc.x + acc.y * acc.y + acc.z * acc.z);

            if (accMagnitude > SHAKE_THRESHOLD) {
                const currentTime = performance.now();
                if (currentTime - lastShakeTime > 400) {
                    lastShakeTime = currentTime;
                    tossDice(accMagnitude, acc.x, acc.y, acc.z);
                }
            }
        }

        // --- 核心進化：四元數重力運算與動態吸力 ---
        function handleOrientation(event) {
            if(!isGameStarted) return;
            
            // 讀取包含水平旋轉的三維數據
            let alpha = event.alpha ? THREE.MathUtils.degToRad(event.alpha) : 0;
            let beta = event.beta ? THREE.MathUtils.degToRad(event.beta) : 0;
            let gamma = event.gamma ? THREE.MathUtils.degToRad(event.gamma) : 0;

            // 讀取螢幕轉向(直式/橫式)
            let orient = 0;
            if (window.screen && window.screen.orientation && window.screen.orientation.angle !== undefined) {
                orient = THREE.MathUtils.degToRad(window.screen.orientation.angle);
            } else if (window.orientation !== undefined) {
                orient = THREE.MathUtils.degToRad(window.orientation);
            }

            // 【黑科技 1：四元數轉換】將手機在真實世界的姿態，精準轉為 3D 空間矩陣
            _euler.set(beta, alpha, -gamma, 'YXZ');
            let quaternion = new THREE.Quaternion();
            quaternion.setFromEuler(_euler);
            quaternion.multiply(_q1);
            quaternion.multiply(_q0.setFromAxisAngle(_zee, -orient));

            // 將真實世界向下 (-Y) 的重力，轉換到手機局部的 X, Y, Z 向量上
            let localGravity = _worldGravity.clone().applyQuaternion(quaternion.invert());

            const maxGravity = 36.0; 
            let gravityX = localGravity.x * maxGravity;
            let gravityZ = -localGravity.y * maxGravity; 
            let gravityY = localGravity.z * maxGravity;

            // 【黑科技 2：動態吸力解除卡死】
            // 當 absZ 趨近於 0 時，代表手機越接近完全垂直(90度)。
            let absZ = Math.abs(localGravity.z); 
            
            // 垂直時吸力降至 1.5 (剛好抵消斜面防漂浮)，平放時吸力恢復為 10.0
            let dynamicAdhesion = 1.5 + (8.5 * absZ); 

            const isFaceDown = localGravity.z > 0;
            gravityY += isFaceDown ? dynamicAdhesion : -dynamicAdhesion;

            if (world) {
                world.gravity.set(gravityX, gravityY, gravityZ);
                diceBodies.forEach(body => {
                    if (body.sleepState === CANNON.Body.SLEEPING) body.wakeUp();
                });
            }
        }

        function updateWallas(material) {
            if(world) {
                const bodiesToRemove = world.bodies.filter(b => b.isWall);
                bodiesToRemove.forEach(b => world.removeBody(b));
            }
            
            const vFovRad = THREE.MathUtils.degToRad(camera.fov);
            const distToMid = camera.position.y - (boxDepth / 2);

            const hz_mid = Math.tan(vFovRad / 2) * distToMid;
            const hx_mid = hz_mid * camera.aspect;

            const angleZ = vFovRad / 2; 
            const angleX = Math.atan(Math.tan(vFovRad / 2) * camera.aspect); 

            const wallThickness = 4; 
            const extraLength = 5;   

            const wallHeightZ = boxDepth / Math.cos(angleZ);
            const wallHeightX = boxDepth / Math.cos(angleX);

            const makeWall = (x, y, z, hx, hy, hz, axis, angle) => {
                const wallBody = new CANNON.Body({ mass: 0, material: material });
                wallBody.addShape(new CANNON.Box(new CANNON.Vec3(hx, hy, hz)));
                wallBody.position.set(x, y, z);
                wallBody.quaternion.setFromAxisAngle(axis, angle);
                wallBody.isWall = true; 
                world.addBody(wallBody);
            };

            makeWall(0, boxDepth / 2, -hz_mid - wallThickness/2, 
                     hx_mid + extraLength, wallHeightZ / 2, wallThickness / 2, 
                     new CANNON.Vec3(1, 0, 0), angleZ);

            makeWall(0, boxDepth / 2, hz_mid + wallThickness/2, 
                     hx_mid + extraLength, wallHeightZ / 2, wallThickness / 2, 
                     new CANNON.Vec3(1, 0, 0), -angleZ);

            makeWall(-hx_mid - wallThickness/2, boxDepth / 2, 0, 
                     wallThickness / 2, wallHeightX / 2, hz_mid + extraLength, 
                     new CANNON.Vec3(0, 0, 1), -angleX);

            makeWall(hx_mid + wallThickness/2, boxDepth / 2, 0, 
                     wallThickness / 2, wallHeightX / 2, hz_mid + extraLength, 
                     new CANNON.Vec3(0, 0, 1), angleX);
        }

        function createDiceFace(number) {
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = '#f5f6fa';
            ctx.fillRect(0, 0, 256, 256);
            ctx.strokeStyle = '#dcdde1';
            ctx.lineWidth = 12;
            ctx.strokeRect(0, 0, 256, 256);
            
            ctx.fillStyle = '#2f3640';
            const drawDot = (x, y) => { ctx.beginPath(); ctx.arc(x, y, 26, 0, Math.PI * 2); ctx.fill(); };
            if ([1, 3, 5].includes(number)) drawDot(128, 128);
            if ([2, 3, 4, 5, 6].includes(number)) { drawDot(70, 70); drawDot(186, 186); }
            if ([4, 5, 6].includes(number)) { drawDot(186, 70); drawDot(70, 186); }
            if (number === 6) { drawDot(70, 128); drawDot(186, 128); }
            if (number === 1) { ctx.fillStyle = '#c23616'; ctx.beginPath(); ctx.arc(128, 128, 38, 0, Math.PI * 2); ctx.fill(); }
            
            const texture = new THREE.CanvasTexture(canvas);
            texture.magFilter = THREE.LinearFilter; 
            texture.minFilter = THREE.LinearMipMapLinearFilter;
            return new THREE.MeshStandardMaterial({ map: texture, roughness: 0.15, metalness: 0.05 });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            updateWallas(standardMaterial);
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now();
            const dt = (time - lastTime) / 1000;
            lastTime = time;

            if (world && isGameStarted) {
                world.step(1 / 60, dt, 5); 
            }

            for (let i = 0; i < diceBodies.length; i++) {
                diceMeshes[i].position.copy(diceBodies[i].position);
                diceMeshes[i].quaternion.copy(diceBodies[i].quaternion);
            }

            if (renderer && scene && camera) {
                renderer.render(scene, camera);
            }
        }

        document.getElementById('start-btn').addEventListener('click', async function() {
            const uiLayer = document.getElementById('ui-layer');
            try { init(); } catch (err) { alert("初始化失敗：" + err.message); return; }

            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const orientPerm = await DeviceOrientationEvent.requestPermission();
                    if (orientPerm === 'granted') window.addEventListener('deviceorientation', handleOrientation);
                } catch (e) { console.error("方向權限遭拒", e); }
            } else {
                window.addEventListener('deviceorientation', handleOrientation);
            }

            if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
                try {
                    const motionPerm = await DeviceMotionEvent.requestPermission();
                    if (motionPerm === 'granted') window.addEventListener('devicemotion', handleMotion);
                } catch (e) { console.error("運動權限遭拒", e); }
            } else {
                window.addEventListener('devicemotion', handleMotion);
            }

            uiLayer.style.opacity = 0;
            setTimeout(() => {
                uiLayer.style.display = 'none';
                document.getElementById('controls').style.display = 'flex';
            }, 500);
            
            isGameStarted = true;
        });

        document.getElementById('add-dice-btn').addEventListener('click', function(e) {
            e.stopPropagation(); 
            addDice();
        });

        document.getElementById('remove-dice-btn').addEventListener('click', function(e) {
            e.stopPropagation();
            removeDice();
        });
    </script>
</body>
</html>
